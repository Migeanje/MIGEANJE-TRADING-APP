[project]
name = "trading-app"
version = "0.1.0"
description = "Rule-driven market research assistant that runs inside Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trading-app = "trading_app.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
