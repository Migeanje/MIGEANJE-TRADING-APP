# Trading rules: the single source of truth for the research agents and the risk code.
#
# Copy this file to config/rules.toml and edit it. config/rules.toml is git-ignored
# because this repository is public: your capital and limits stay on your machine.

[account]
# Budget the agents may plan with (not your whole net worth).
capital = 1000.0
currency = "USD"

[risk]
# Maximum % of capital you accept to lose if a single trade hits its stop.
risk_per_trade_pct = 1.0
# Maximum % of capital allocated to a single position.
max_position_pct = 20.0
# Stop opening trades for the day once losses reach this % of capital.
max_daily_loss_pct = 3.0
# Minimum expected reward / risk ratio for a candidate to be proposed.
min_reward_risk = 2.0

[strategy]
# One of: "intraday", "swing", "position".
horizon = "swing"
# Expected holding period, in days.
min_holding_days = 2
max_holding_days = 20
# How many candidates the daily report may propose.
max_candidates = 5

[markets]
stocks = true
crypto = true
# Empty list = any symbol in the enabled markets.
allowed_symbols = []
blocked_symbols = []
